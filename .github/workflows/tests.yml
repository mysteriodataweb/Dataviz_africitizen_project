name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Run the exploratory analysis notebook
        run: jupyter nbconvert --to notebook --execute Exploratory_analysis.ipynb --output-dir /tmp --ExecutePreprocessor.timeout=600
